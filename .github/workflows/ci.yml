name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [master, develop, 'feature/**', 'fix/**', 'chore/**']

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify repository context/spec baseline
        run: python3 verification/verify_repository.py

  backend-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Apply Spotless formatting
        run: ./mvnw -B -ntp -f backend/pom.xml spotless:apply
      - name: Verify formatted sources are committed
        run: |
          if ! git diff --exit-code -- backend; then
            echo "::error::Spotless changed backend sources. Run './mvnw -f backend/pom.xml spotless:apply' locally and commit the result."
            exit 1
          fi

  backend-test:
    needs: backend-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Test backend
        run: ./mvnw -B -ntp -f backend/pom.xml verify

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate root and split compose files
        env:
          POSTGRES_PASSWORD: ci-only-placeholder
          KEYCLOAK_DB_PASSWORD: ci-only-placeholder
          KEYCLOAK_ADMIN_PASSWORD: ci-only-placeholder
          KEYCLOAK_DEMO_USER_PASSWORD: ci-only-placeholder
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          docker compose --project-directory . -f compose/infrastructure.yml -f compose/backend/all.yml config >/dev/null

  dockerfile-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate backend Dockerfiles
        run: |
          docker buildx build --check -f backend/Dockerfile.runtime backend
          docker buildx build --check --build-arg MODULE=be-auth-api -f backend/Dockerfile.service backend
          docker buildx build --check -f Dockerfile.backend .

  runtime-smoke:
    needs: [repository-quality, backend-format, backend-test, compose-validation, dockerfile-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      KEYCLOAK_DB_PASSWORD: ci-only-keycloak-db-password
      KEYCLOAK_ADMIN_PASSWORD: ci-only-keycloak-admin-password
      KEYCLOAK_DEMO_USER_PASSWORD: ci-only-demo-user-password
      AUTH_KEYCLOAK_CLIENT_ID: be-auth-api
      AUTH_KEYCLOAK_KEY_ID: be-auth-api-key-1
      AUTH_KEYCLOAK_ASSERTION_TTL: PT30S
    steps:
      - uses: actions/checkout@v6
      - name: Build and start auth runtime stack
        run: docker compose up -d --build postgres redis keycloak be-auth-api
      - name: Wait for auth service health
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8081/actuator/health >/tmp/auth-health.json; then
              cat /tmp/auth-health.json
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Verify Keycloak private_key_jwt service authentication
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps --entrypoint cat auth-keygen /keys/client-private.pem > /tmp/client-private.pem
          chmod 0600 /tmp/client-private.pem

          base64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }

          TOKEN_URI='http://localhost:8180/realms/digital-wallet/protocol/openid-connect/token'
          NOW="$(date +%s)"
          EXP="$((NOW + 30))"
          JTI="$(cat /proc/sys/kernel/random/uuid)"
          HEADER="$(printf '%s' '{"alg":"RS256","typ":"JWT","kid":"be-auth-api-key-1"}' | base64url)"
          PAYLOAD="$(jq -cn \
            --arg iss 'be-auth-api' \
            --arg aud "${TOKEN_URI}" \
            --arg jti "${JTI}" \
            --argjson iat "${NOW}" \
            --argjson exp "${EXP}" \
            '{iss:$iss,sub:$iss,aud:$aud,iat:$iat,exp:$exp,jti:$jti}' | base64url)"
          SIGNING_INPUT="${HEADER}.${PAYLOAD}"
          SIGNATURE="$(printf '%s' "${SIGNING_INPUT}" \
            | openssl dgst -sha256 -sign /tmp/client-private.pem -binary \
            | base64url)"
          CLIENT_ASSERTION="${SIGNING_INPUT}.${SIGNATURE}"

          TOKEN_RESPONSE="$(curl -fsS \
            --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode 'client_id=be-auth-api' \
            --data-urlencode 'client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer' \
            --data-urlencode "client_assertion=${CLIENT_ASSERTION}" \
            "${TOKEN_URI}")"
          ACCESS_TOKEN="$(jq -er '.access_token' <<<"${TOKEN_RESPONSE}")"
          echo "::add-mask::${ACCESS_TOKEN}"

          JWKS="$(curl -fsS http://localhost:8081/.well-known/wallet-client-jwks.json)"
          jq -e '.keys[0].kid == "be-auth-api-key-1" and .keys[0].kty == "RSA" and (.keys[0] | has("d") | not)' \
            <<<"${JWKS}" >/dev/null

          PROFILE="$(curl -fsS \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            http://localhost:8081/api/v1/me/profile)"
          PERMISSIONS="$(curl -fsS \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            http://localhost:8081/api/v1/me/permissions)"
          SCOPES="$(curl -fsS \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            http://localhost:8081/api/v1/me/scopes)"

          jq -e '.data.username == "service-account-be-auth-api" and .data.actorType == "SERVICE"' \
            <<<"${PROFILE}" >/dev/null
          jq -e '(.data.roles | index("SERVICE_ACCOUNT")) != null' <<<"${PROFILE}" >/dev/null
          jq -e '(.data.permissions | type) == "array"' <<<"${PERMISSIONS}" >/dev/null
          jq -e '(.data.scopes | type) == "array"' <<<"${SCOPES}" >/dev/null
      - name: Print runtime diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color postgres redis keycloak be-auth-api
      - name: Stop runtime stack
        if: always()
        run: docker compose down -v --remove-orphans
