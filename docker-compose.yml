name: digital-wallet
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wallet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KYC_DB_PASSWORD: ${KYC_DB_PASSWORD:?KYC_DB_PASSWORD is required}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD is required}
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - wallet

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - wallet

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - 29092:29092
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 40
    networks:
      - wallet

  auth-keygen:
    image: alpine:3.22
    command:
      - /bin/sh
      - -c
      - apk add --no-cache openssl >/dev/null && /usr/local/bin/generate-auth-client-key.sh
    volumes:
      - ./infrastructure/keycloak/generate-auth-client-key.sh:/usr/local/bin/generate-auth-client-key.sh:ro
      - auth-client-key:/keys
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
      KEYCLOAK_DEMO_USER_PASSWORD: ${KEYCLOAK_DEMO_USER_PASSWORD:?KEYCLOAK_DEMO_USER_PASSWORD is required}
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m
    ports:
      - 8180:8080
    volumes:
      - ./infrastructure/keycloak/realm-digital-wallet.json:/opt/keycloak/data/import/realm-digital-wallet.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks:
      - wallet

  be-auth-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        MODULE: be-auth-api
    environment:
      SERVER_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/digital-wallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: digital-wallet
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/token
      AUTH_KEYCLOAK_CLIENT_ID: ${AUTH_KEYCLOAK_CLIENT_ID:-be-auth-api}
      AUTH_KEYCLOAK_PRIVATE_KEY_LOCATION: file:/run/wallet-auth-key/client-private.pem
      AUTH_KEYCLOAK_KEY_ID: ${AUTH_KEYCLOAK_KEY_ID:-be-auth-api-key-1}
      AUTH_KEYCLOAK_ASSERTION_TTL: ${AUTH_KEYCLOAK_ASSERTION_TTL:-PT30S}
      AUTH_KEYCLOAK_ASSERTION_AUDIENCE: http://localhost:8180/realms/digital-wallet/protocol/openid-connect/token
      AUTH_CACHE_TTL: ${AUTH_CACHE_TTL:-PT2M}
    ports:
      - 8081:8080
    volumes:
      - auth-client-key:/run/wallet-auth-key:ro
    depends_on:
      auth-keygen:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - wallet

  be-customer-kyc-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        MODULE: be-customer-kyc-api
    environment:
      SERVER_PORT: "8080"
      KYC_DB_HOST: postgres
      KYC_DB_PORT: "5432"
      KYC_DB_NAME: customer_kyc_db
      KYC_DB_USERNAME: customer_kyc
      KYC_DB_PASSWORD: ${KYC_DB_PASSWORD:?KYC_DB_PASSWORD is required}
      KYC_DOCUMENT_HMAC_SECRET: ${KYC_DOCUMENT_HMAC_SECRET:?KYC_DOCUMENT_HMAC_SECRET is required}
      AUTH_API_BASE_URL: http://be-auth-api:8080
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/digital-wallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/certs
    ports:
      - 8082:8080
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      be-auth-api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - wallet

  be-wallet-account-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        MODULE: be-wallet-account-api
    environment:
      SERVER_PORT: "8080"
      WALLET_DB_HOST: postgres
      WALLET_DB_PORT: "5432"
      WALLET_DB_NAME: wallet_account_db
      WALLET_DB_USER: wallet_account
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD is required}
      AUTH_API_BASE_URL: http://be-auth-api:8080
      WALLET_KYC_BASE_URL: http://be-customer-kyc-api:8080
      WALLET_SUPPORTED_CURRENCIES: ${WALLET_SUPPORTED_CURRENCIES:-VND}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/digital-wallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/certs
    ports:
      - 8083:8080
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      be-auth-api:
        condition: service_healthy
      be-customer-kyc-api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - wallet

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  auth-client-key:
networks:
  wallet:
    name: digital-wallet-network
