name: digital-wallet
services:
  be-customer-kyc-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        MODULE: be-customer-kyc-api
    environment:
      SERVER_PORT: "8080"
      KYC_DB_HOST: postgres
      KYC_DB_PORT: "5432"
      KYC_DB_NAME: customer_kyc_db
      KYC_DB_USERNAME: customer_kyc
      KYC_DB_PASSWORD: ${KYC_DB_PASSWORD:?KYC_DB_PASSWORD is required}
      KYC_DOCUMENT_HMAC_SECRET: ${KYC_DOCUMENT_HMAC_SECRET:?KYC_DOCUMENT_HMAC_SECRET is required}
      AUTH_API_BASE_URL: http://be-auth-api:8080
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/digital-wallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/certs
    ports:
      - 8082:8080
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      be-auth-api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - wallet
networks:
  wallet:
    name: digital-wallet-network
