name: digital-wallet
services:
  auth-keygen:
    image: alpine:3.22
    command:
      - /bin/sh
      - -c
      - apk add --no-cache openssl >/dev/null && /usr/local/bin/generate-auth-client-key.sh
    volumes:
      - ./infrastructure/keycloak/generate-auth-client-key.sh:/usr/local/bin/generate-auth-client-key.sh:ro
      - auth-client-key:/keys
    restart: "no"

  be-auth-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        MODULE: be-auth-api
    environment:
      SERVER_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/digital-wallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: digital-wallet
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/token
      AUTH_KEYCLOAK_CLIENT_ID: ${AUTH_KEYCLOAK_CLIENT_ID:-be-auth-api}
      AUTH_KEYCLOAK_PRIVATE_KEY_LOCATION: file:/run/wallet-auth-key/client-private.pem
      AUTH_KEYCLOAK_KEY_ID: ${AUTH_KEYCLOAK_KEY_ID:-be-auth-api-key-1}
      AUTH_KEYCLOAK_ASSERTION_TTL: ${AUTH_KEYCLOAK_ASSERTION_TTL:-PT30S}
      AUTH_KEYCLOAK_ASSERTION_AUDIENCE: http://localhost:8180/realms/digital-wallet/protocol/openid-connect/token
      AUTH_CACHE_TTL: ${AUTH_CACHE_TTL:-PT2M}
    ports:
      - 8081:8080
    volumes:
      - auth-client-key:/run/wallet-auth-key:ro
    depends_on:
      auth-keygen:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - wallet
volumes:
  auth-client-key:
networks:
  wallet:
    name: digital-wallet-network
