name: digital-wallet
services:
  be-auth-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        MODULE: be-auth-api
    environment:
      SERVER_PORT: "8080"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/digital-wallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: digital-wallet
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/token
      AUTH_KEYCLOAK_CLIENT_ID: be-auth-api
      AUTH_KEYCLOAK_CLIENT_SECRET: ${AUTH_KEYCLOAK_CLIENT_SECRET:?AUTH_KEYCLOAK_CLIENT_SECRET is required}
      AUTH_CACHE_TTL: ${AUTH_CACHE_TTL:-PT2M}
    ports:
      - 8081:8080
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - wallet
networks:
  wallet:
    name: digital-wallet-network
