name: digital-wallet
services:
  be-wallet-account-api:
    build:
      context: ./backend
      dockerfile: Dockerfile.service
      args:
        MODULE: be-wallet-account-api
    environment:
      SERVER_PORT: "8080"
      WALLET_DB_HOST: postgres
      WALLET_DB_PORT: "5432"
      WALLET_DB_NAME: wallet_account_db
      WALLET_DB_USER: wallet_account
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD:?WALLET_DB_PASSWORD is required}
      AUTH_API_BASE_URL: http://be-auth-api:8080
      WALLET_KYC_BASE_URL: http://be-customer-kyc-api:8080
      WALLET_SUPPORTED_CURRENCIES: ${WALLET_SUPPORTED_CURRENCIES:-VND}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/digital-wallet
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/digital-wallet/protocol/openid-connect/certs
    ports:
      - 8083:8080
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      be-auth-api:
        condition: service_healthy
      be-customer-kyc-api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - wallet
networks:
  wallet:
    name: digital-wallet-network
